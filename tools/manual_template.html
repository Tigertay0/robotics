<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Robot Build Manual</title>
<meta name="description" content="Picture-only, step-by-step 3D build instructions for Team Rochambotics' two KIPR Botball 2026 robots.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=block" rel="stylesheet">
<style>
:root{
  --bg:#f4f2ed; --ink:#1d232b; --ink2:#47505b; --ink3:#7a838d; --rule:#e2ded5;
  --callout:#d3e0ec; --callout-line:#93aac0;
  --print:#c9772a; --hl:#ffa412; --arrow:#e2391f; --frame:#3f4d5b;
  --ok:#2f9e5a; --no:#d23b2a; --s:1;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
#stage{position:fixed;left:0;top:0;width:100vw;height:100vh;overflow:hidden;background:var(--bg);transform-origin:0 0}
body.video #stage{width:1920px;height:1080px}
#gl{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#ov{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#frame{position:absolute;border:calc(var(--s)*3px) solid var(--frame);border-radius:calc(var(--s)*6px);pointer-events:none;opacity:0;box-shadow:0 10px 30px -18px rgba(20,30,40,.35)}
#rot{position:absolute;width:calc(var(--s)*112px);height:calc(var(--s)*112px);pointer-events:none;opacity:0}
#rot svg{width:100%;height:100%;display:block}
#flash{position:absolute;inset:0;background:var(--bg);opacity:0;pointer-events:none}
#loading{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;color:var(--ink3);letter-spacing:.02em}
#loading.err{color:#a3342a}

/* top bar */
#topbar{position:absolute;left:calc(var(--s)*56px);right:calc(var(--s)*56px);top:calc(var(--s)*30px);height:calc(var(--s)*48px);display:flex;align-items:center;justify-content:space-between;gap:12px;pointer-events:none}
.brand{font-size:max(11px,calc(var(--s)*16px));font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.brand b{color:var(--ink);font-weight:800}
.tr{display:flex;align-items:center;gap:10px}
#robotlabel{font-size:calc(var(--s)*22px);font-weight:800;color:var(--ink2)}
#robotlabel b{display:inline-grid;place-items:center;width:calc(var(--s)*40px);height:calc(var(--s)*40px);border-radius:50%;background:var(--ink);color:#fff;font-size:calc(var(--s)*21px);margin-right:calc(var(--s)*10px);vertical-align:middle}
#switch{pointer-events:auto;display:flex;background:#e8e5de;border-radius:999px;padding:4px;gap:2px}
#switch button{font:inherit;font-size:max(14px,calc(var(--s)*18px));font-weight:800;color:var(--ink2);background:transparent;border:0;border-radius:999px;padding:0 calc(var(--s)*18px);min-height:44px;cursor:pointer;transition:background-color .18s ease,color .18s ease}
#switch button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(20,26,33,.12)}
#switch button span{color:var(--ink3);font-weight:600;margin-left:6px}
#aa{pointer-events:auto;font:inherit;font-weight:800;font-size:max(14px,calc(var(--s)*18px));min-width:48px;min-height:44px;border-radius:999px;border:2px solid #d9d5cc;background:#fff;color:var(--ink3);cursor:pointer;transition:background-color .18s ease,color .18s ease,border-color .18s ease}
#aa[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

/* panels */
#panels{position:absolute;inset:0;pointer-events:none}
.panel{position:absolute;left:calc(var(--s)*56px);top:calc(var(--s)*104px);width:max-content;max-width:calc(var(--s)*600px);min-width:calc(var(--s)*260px);visibility:hidden}
.panel.on{visibility:visible}
.stephead{display:flex;align-items:flex-end;gap:calc(var(--s)*16px)}
.stepno{font-size:calc(var(--s)*150px);font-weight:900;line-height:.74;letter-spacing:-.05em;color:var(--ink)}
.subno{display:grid;place-items:center;min-width:calc(var(--s)*62px);height:calc(var(--s)*62px);padding:0 calc(var(--s)*10px);border-radius:calc(var(--s)*14px);background:var(--ink);color:#fff;font-size:calc(var(--s)*40px);font-weight:800;line-height:1}
.subdots{display:flex;flex-wrap:wrap;gap:calc(var(--s)*6px);max-width:calc(var(--s)*230px);padding-bottom:calc(var(--s)*6px)}
.subdots i{width:calc(var(--s)*13px);height:calc(var(--s)*13px);border-radius:50%;border:calc(var(--s)*2.5px) solid #b9b4aa}
.subdots i.d{background:#b9b4aa;border-color:#b9b4aa}
.subdots i.c{background:var(--ink);border-color:var(--ink);transform:scale(1.25)}
.note{display:none;margin-top:calc(var(--s)*18px);font-size:calc(var(--s)*19px);line-height:1.42;color:var(--ink2);max-width:calc(var(--s)*560px);text-wrap:pretty}
#stage.notes .note{display:block}
.callout{position:relative;margin-top:calc(var(--s)*24px);background:var(--callout);border:calc(var(--s)*3px) solid var(--callout-line);border-radius:calc(var(--s)*18px);padding:calc(var(--s)*14px);display:flex;flex-wrap:wrap;align-items:flex-end;gap:calc(var(--s)*12px) calc(var(--s)*14px);width:max-content;max-width:100%}
.pc{position:relative;width:calc(var(--s)*112px);display:flex;flex-direction:column;align-items:center}
.pc.sa .th{background:#fff;border:calc(var(--s)*2.5px) solid var(--frame);border-radius:calc(var(--s)*6px)}
.th{width:calc(var(--s)*108px);height:calc(var(--s)*94px);display:grid;place-items:center}
.th img,.th svg{max-width:100%;max-height:100%;display:block}
.qty{font-size:calc(var(--s)*27px);font-weight:900;letter-spacing:-.01em;line-height:1.1}
.pr{position:absolute;right:calc(var(--s)*-4px);top:calc(var(--s)*-6px);width:calc(var(--s)*34px);height:calc(var(--s)*34px);border-radius:50%;background:var(--print);display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.pr svg{width:72%;height:72%}
.nm{display:block;margin-top:calc(var(--s)*3px);font-size:calc(var(--s)*12px);line-height:1.2;color:var(--ink2);text-align:center;max-width:100%;overflow-wrap:anywhere}
#stage.notes .ctx{display:block}
.ctx{display:none;font-size:calc(var(--s)*11px);color:var(--ink3);text-align:center;line-height:1.25;margin-top:2px}
.spin{width:100%;height:100%;background-repeat:no-repeat;background-size:1200% 100%;background-position:0 0}
.callout .pc,.callout .sb{pointer-events:auto}
.snm{flex-basis:100%;font-size:calc(var(--s)*12px);font-weight:600;color:var(--ink2);white-space:normal;max-width:calc(var(--s)*190px);line-height:1.2}
#tags{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ntag{position:absolute;left:0;top:0;white-space:nowrap;font-size:max(11px,calc(var(--s)*16px));font-weight:700;color:#1d232b;background:#fff;border:calc(var(--s)*2px) solid #1d232b;border-radius:calc(var(--s)*8px);padding:calc(var(--s)*3px) calc(var(--s)*9px);box-shadow:0 2px 8px rgba(20,30,40,.14);opacity:0}
.ntag.old{border-color:#a9b1ba;color:#47505b;font-weight:600;font-size:max(10px,calc(var(--s)*13px));padding:calc(var(--s)*2px) calc(var(--s)*7px)}
.badge{position:absolute;left:0;top:0;width:calc(var(--s)*28px);height:calc(var(--s)*28px);border-radius:50%;background:#ff6a00;color:#fff;font-weight:900;font-size:calc(var(--s)*16px);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);opacity:0}
#final{position:absolute;border:2px solid #d9d5cc;border-radius:calc(var(--s)*12px);pointer-events:none;opacity:0;overflow:hidden}
#final svg{position:absolute;left:calc(var(--s)*8px);top:calc(var(--s)*6px);width:calc(var(--s)*26px);height:calc(var(--s)*26px)}
#names[aria-pressed="true"]{background:var(--ink);color:#fff}
.pbadge{display:inline-flex;align-items:center;gap:calc(var(--s)*5px);background:var(--print);color:#fff;font-weight:900;font-size:max(10px,calc(var(--s)*13px));letter-spacing:.04em;line-height:1;border-radius:calc(var(--s)*7px);padding:calc(var(--s)*4px) calc(var(--s)*7px);white-space:nowrap;box-shadow:0 1px 3px rgba(120,60,0,.35)}
.pbadge svg{width:1.35em;height:1.35em;flex:none}
.kbadge{display:inline-block;background:#e3e0d8;color:var(--ink2);font-weight:800;font-size:max(9px,calc(var(--s)*10.5px));letter-spacing:.08em;line-height:1;border-radius:calc(var(--s)*5px);padding:calc(var(--s)*3px) calc(var(--s)*6px)}
.pc .pbadge,.pc .kbadge{margin-top:calc(var(--s)*3px)}
.pc.isprint .th{outline:calc(var(--s)*3px) solid var(--print);outline-offset:calc(var(--s)*2px);border-radius:calc(var(--s)*10px);background:#fff4e8}
.ntag .pbadge{margin-right:calc(var(--s)*7px);vertical-align:middle;font-size:max(9px,calc(var(--s)*12px))}
#ribbon{position:absolute;left:0;top:0;opacity:0;pointer-events:none;font-size:max(14px,calc(var(--s)*26px));padding:calc(var(--s)*10px) calc(var(--s)*18px);border-radius:calc(var(--s)*14px);border:calc(var(--s)*3px) solid #fff;box-shadow:0 6px 18px -6px rgba(120,60,0,.55)}
#stage.phone #ribbon{font-size:12px;padding:5px 9px}
.sb{position:relative;background:#eef3f8;border-radius:calc(var(--s)*12px);padding:calc(var(--s)*10px) calc(var(--s)*12px) calc(var(--s)*6px);display:grid;grid-template-columns:auto auto;column-gap:calc(var(--s)*10px);row-gap:calc(var(--s)*4px);align-items:center}
.sb svg{display:block}
.sbl{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:calc(var(--s)*8px);white-space:nowrap}
.sbq{font-size:calc(var(--s)*27px);font-weight:900}
.sbm{font-size:calc(var(--s)*15px);font-weight:800;color:#fff;background:var(--ink2);border-radius:calc(var(--s)*6px);padding:calc(var(--s)*2px) calc(var(--s)*6px)}
.sbm small{font-weight:600;opacity:.8;margin-left:2px}
.one{position:absolute;right:calc(var(--s)*8px);bottom:calc(var(--s)*6px);font-size:calc(var(--s)*12px);font-weight:900;color:var(--ink2);border:calc(var(--s)*2px) solid var(--ink2);border-radius:calc(var(--s)*5px);padding:0 calc(var(--s)*4px);line-height:1.35}
.hint{margin-top:calc(var(--s)*16px);background:#fff;border:calc(var(--s)*2px) solid var(--rule);border-radius:calc(var(--s)*18px);padding:calc(var(--s)*10px) calc(var(--s)*14px);width:max-content;max-width:100%;box-shadow:0 8px 24px -18px rgba(30,40,50,.3)}
.hint svg{display:block;width:calc(var(--s)*var(--hw,400px));height:auto;max-width:100%}

/* cover */
.panel.cover{top:calc(var(--s)*180px);width:calc(var(--s)*700px);max-width:none}
.letter{display:inline-grid;place-items:center;width:calc(var(--s)*92px);height:calc(var(--s)*92px);border-radius:calc(var(--s)*22px);background:var(--ink);color:#fff;font-size:calc(var(--s)*58px);font-weight:900}
.cname{margin-top:calc(var(--s)*30px);font-size:calc(var(--s)*112px);font-weight:900;line-height:.92;letter-spacing:-.04em}
.crole{font-size:calc(var(--s)*25px)}
.cstats{margin-top:calc(var(--s)*44px);display:flex;flex-wrap:wrap;gap:calc(var(--s)*16px)}
.cstats div{display:flex;align-items:center;gap:calc(var(--s)*10px);background:#fff;border:1px solid var(--rule);border-radius:calc(var(--s)*16px);padding:calc(var(--s)*10px) calc(var(--s)*16px)}
.cstats svg{width:calc(var(--s)*46px);height:calc(var(--s)*46px)}
.cstats b{font-size:calc(var(--s)*40px);color:var(--ink);font-weight:900;letter-spacing:-.02em;line-height:1}

/* done */
.panel.done{width:calc(var(--s)*640px);max-width:none;top:calc(var(--s)*96px)}
.dhead{display:flex;align-items:center;gap:calc(var(--s)*18px)}
.dhead svg{width:calc(var(--s)*104px);height:calc(var(--s)*104px)}
.bom{margin-top:calc(var(--s)*16px);background:#fff;border:1px solid var(--rule);border-radius:calc(var(--s)*20px);padding:calc(var(--s)*12px)}
.bomgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:calc(var(--s)*6px)}
.bt{display:flex;flex-direction:column;align-items:center;padding:calc(var(--s)*4px) 0;border-radius:calc(var(--s)*10px);background:#f6f4ef;position:relative}
.bt .th{width:calc(var(--s)*80px);height:calc(var(--s)*60px)}
.bt .qty{font-size:calc(var(--s)*19px)}
.bt .pr{width:calc(var(--s)*24px);height:calc(var(--s)*24px);right:calc(var(--s)*2px);top:calc(var(--s)*2px)}
.bt .nm{font-size:calc(var(--s)*10px);padding:0 2px}

/* wiring card */
.wirecard{position:absolute;visibility:hidden;background:#fff;border:1px solid var(--rule);border-radius:calc(var(--s)*24px);box-shadow:0 1px 2px rgba(30,30,20,.05),0 12px 40px -18px rgba(30,40,50,.18);pointer-events:none;display:flex;flex-direction:column;padding:calc(var(--s)*22px) calc(var(--s)*26px)}
.wirecard.on{visibility:visible}
.wirecard svg{flex:1;min-height:0;width:100%}
.wcap{font-size:calc(var(--s)*15px);color:var(--ink3);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.legend{display:flex;gap:calc(var(--s)*18px);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--ink2)}
.legend i{display:inline-block;width:calc(var(--s)*22px);height:4px;border-radius:2px}

/* controls */
#controls{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--s)*44px);display:flex;align-items:center;gap:10px;max-width:calc(100% - 24px)}
.nav{font:inherit;font-size:max(14px,calc(var(--s)*17px));font-weight:700;height:max(48px,calc(var(--s)*60px));padding:0 calc(var(--s)*26px);min-width:max(64px,calc(var(--s)*96px));border-radius:999px;border:0;background:var(--ink);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s ease,background-color .18s ease}
.nav.ghost{background:#e8e5de;color:var(--ink)}
.nav:active{transform:scale(.97)}
.nav:disabled{opacity:.35;cursor:default}
.nav svg{width:max(22px,calc(var(--s)*28px));height:max(22px,calc(var(--s)*28px))}
#strip{display:flex;gap:4px;background:#e8e5de;border-radius:999px;padding:5px;overflow-x:auto;scrollbar-width:none;max-width:60vw}
#strip::-webkit-scrollbar{display:none}
#strip button{font:inherit;flex:none;min-width:max(40px,calc(var(--s)*48px));height:max(40px,calc(var(--s)*50px));padding:0 8px;border-radius:999px;border:0;background:transparent;color:var(--ink2);font-weight:800;font-size:max(14px,calc(var(--s)*18px));cursor:pointer;transition:background-color .18s ease,color .18s ease;display:inline-grid;place-items:center}
#strip button svg{width:max(18px,calc(var(--s)*22px));height:max(18px,calc(var(--s)*22px))}
#strip button:hover{background:rgba(255,255,255,.55)}
#strip button[aria-current="step"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(20,26,33,.14)}
#tools{position:absolute;right:calc(var(--s)*56px);bottom:calc(var(--s)*44px);display:flex;gap:10px}
#tools .nav{min-width:max(48px,calc(var(--s)*60px));padding:0}
button:focus-visible{outline:3px solid #3b7bd0;outline-offset:2px}
#foot{position:absolute;left:calc(var(--s)*56px);right:calc(var(--s)*56px);bottom:calc(var(--s)*12px);display:flex;justify-content:space-between;gap:16px;font-size:max(11px,calc(var(--s)*14px));color:var(--ink3);pointer-events:none}
body.video #controls,body.video #tools,body.video #switch,body.video #aa{display:none}
body:not(.video) #robotlabel{display:none}

/* phone */
#stage.phone .panel{left:12px;right:12px;width:auto;max-width:none;min-width:0;top:62px}
#stage.phone .stephead{gap:10px}
#stage.phone .stepno{font-size:58px}
#stage.phone .subno{min-width:36px;height:36px;font-size:22px;border-radius:9px;padding:0 6px}
#stage.phone .subdots{gap:4px;max-width:150px;padding-bottom:2px}
#stage.phone .subdots i{width:9px;height:9px;border-width:2px}
#stage.phone .note{font-size:13px;margin-top:8px}
#stage.phone .callout{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;width:auto;padding:8px;gap:8px;margin-top:10px;border-radius:14px;border-width:2px;pointer-events:auto}
#stage.phone .pc{width:66px;flex:none}
#stage.phone .th{width:62px;height:50px}
#stage.phone .qty,#stage.phone .sbq{font-size:18px}
#stage.phone .pr{width:22px;height:22px}
#stage.phone .sb{flex:none;padding:6px 8px 4px}
#stage.phone .sbm{font-size:11px}
#stage.phone .hint{margin-top:8px;padding:4px 8px;border-radius:12px}
#stage.phone .hint svg{width:calc(var(--hw,400px) * .5)}
#stage.phone .panel.cover{top:70px}
#stage.phone .letter{width:52px;height:52px;font-size:32px;border-radius:14px}
#stage.phone .cname{font-size:44px;margin-top:12px}
#stage.phone .crole{font-size:15px}
#stage.phone .cstats{margin-top:14px;gap:8px}
#stage.phone .cstats div{padding:6px 10px;gap:6px}
#stage.phone .cstats svg{width:28px;height:28px}
#stage.phone .cstats b{font-size:22px}
#stage.phone .dhead svg{width:56px;height:56px}
#stage.phone .bom{max-height:44vh;overflow-y:auto;pointer-events:auto;padding:8px}
#stage.phone .bomgrid{grid-template-columns:repeat(5,1fr)}
#stage.phone .bt .th{width:48px;height:38px}
#stage.phone .bt .qty{font-size:14px}
#stage.phone #topbar{left:12px;right:12px;top:10px}
#stage.phone .brand{display:none}
#stage.phone #controls{left:10px;right:10px;transform:none;bottom:34px;max-width:none;justify-content:space-between;gap:6px}
#stage.phone #strip{flex:1;max-width:none}
#stage.phone .nav{padding:0 12px;min-width:56px}
#stage.phone #tools{right:12px;bottom:96px}
#stage.phone #foot{left:12px;right:12px;bottom:6px;font-size:9.5px}
#stage.phone .wirecard{padding:12px}
#stage.phone #rot{width:58px;height:58px}
@media (prefers-reduced-motion: reduce){ .nav,#strip button,#switch button,#aa{transition:none} }
</style>

</script>

<body>
<div id="stage">
  <canvas id="gl" aria-label="3D view of the robot being built"></canvas>
  <div id="frame"></div>
  <div id="final" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 21V4" stroke="#1d232b" stroke-width="2.4" stroke-linecap="round"/><path d="M5 4h13l-3 4 3 4H5z" fill="#2f9e5a"/></svg></div>
  <svg id="ov" aria-hidden="true"><path id="tlo" fill="none" stroke="#7a838d" stroke-width="1.3"/><path id="tdo" fill="#7a838d"/><path id="tln" fill="none" stroke="#1d232b" stroke-width="1.8"/><path id="tdn" fill="#1d232b"/><path id="thv" fill="none" stroke="#ff6a00" stroke-width="2.5" stroke-dasharray="6 5"/></svg>
  <div id="tags" aria-hidden="true"></div>
  <div id="rot" aria-hidden="true"></div>
  <div id="ribbon" class="pbadge" aria-label="3D printed part"></div>
  <div id="panels" aria-live="polite"></div>
  <div id="topbar">
    <div class="brand"><b>Rochambotics</b>&nbsp; Build</div>
    <div id="robotlabel"></div>
    <div class="tr">
      <button id="aa" aria-pressed="false" aria-label="Show or hide the English notes" title="Text">Aa</button>
      <div id="switch" role="group" aria-label="Choose robot"></div>
    </div>
  </div>
  <nav id="controls" aria-label="Manual navigation">
    <button class="nav ghost" id="back" aria-label="Previous step"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div id="strip" role="group" aria-label="Jump to step"></div>
    <button class="nav" id="next" aria-label="Next step"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>

    insets.forEach((ins, i) => {
      const D = Math.max(16, Math.round(ins.r * 2 * renderer.getPixelRatio()));
      const rt = RTS[i]; if (rt.width !== D) rt.setSize(D, D);
      const dist = ins.Rmm / Math.tan(THREE.MathUtils.degToRad(INSET_FOV / 2));
      insetCam.position.copy(ins.P).addScaledVector(ins.v, dist);
      insetCam.up.set(0, 1, 0); insetCam.lookAt(ins.P);
      insetCam.near = Math.max(0.3, dist * 0.08); insetCam.far = dist + 900; insetCam.aspect = 1;
      CLIP.normal.copy(ins.d); CLIP.constant = -ins.qd;
      for (const a of R.arrows) { const u = a.userData; a.visible = u.where === ins.pass && u.alpha > 0.01 && ins.arrows.has(a); }
      for (const m of R.meshes) m.ghost.visible = m.ghostOn && m.alpha > 0.5 && ins.meshSet.has(m);
      for (const r of R.rings) r.visible = r.userData.where === ins.pass && r.userData.alpha > 0.01 && ins.rings.has(r);
      insetCam.updateProjectionMatrix();
      setArrowScale(R, 2 * ins.Rmm / (ins.r * 2) * 1.0);
      renderer.setRenderTarget(rt); renderer.setClearColor(0x000000, 0); renderer.clear();
      renderer.render(scene, insetCam);
      if (ins.spots) for (const sp of ins.spots) {
        _v.copy(sp.tail).project(insetCam);
        const bx = ins.cx + _v.x * ins.r, by = ins.cy - _v.y * ins.r;
        sp._ib = Math.hypot(bx - ins.cx, by - ins.cy) < ins.r * 0.86 && _v.z < 1 ? { x: bx, y: by } : null;
      }
    });
    renderer.setRenderTarget(null); renderer.setClearColor(BG, 1); scene.background = BG;
    CLIP.normal.set(0, 1, 0); CLIP.constant = 1e7;
    /* composite circles + rings + leader lines */
    const pxScale = insA;
    insets.forEach((ins, i) => {
      const dsc = insetDiscs[i], rr = ins.r * (0.85 + 0.15 * easeOut(pxScale));
      dsc.bg.visible = dsc.fg.visible = true;
      dsc.bg.position.set(ins.cx, H - ins.cy, 0); dsc.fg.position.copy(dsc.bg.position);
      dsc.bg.scale.setScalar(rr); dsc.fg.scale.setScalar(rr);
      dsc.bg.material.opacity = pxScale; dsc.fg.material.opacity = pxScale;
      dsc.fg.material.color.setScalar(pxScale);
      /* leader */
      const pc = ins.pass === 'panel' ? panelCam : camera, vr = ins.pass === 'panel' ? L.frame : { x: 0, y: 0, w: W, h: H };
      _v.copy(ins.P).project(pc);
      const mx = vr.x + (_v.x + 1) / 2 * vr.w, my = vr.y + (1 - _v.y) / 2 * vr.h;
      const dP = pc.position.distanceTo(ins.P);
      const pxmm = vr.h / (2 * dP * Math.tan(THREE.MathUtils.degToRad(FOV / 2)));
      const mr = Math.max(9 * S, ins.Rmm * pxmm);
      const dx = mx - ins.cx, dy = my - ins.cy, dl = Math.hypot(dx, dy) || 1;
      const [ring, ring2] = OV.rings[i];
      ring.style.display = ring2.style.display = OV.leads[i].style.display = OV.marks[i].style.display = '';
      ring.setAttribute('cx', ins.cx); ring.setAttribute('cy', ins.cy); ring.setAttribute('r', rr); ring.setAttribute('stroke-width', 6 * S + 1);
      ring2.setAttribute('cx', ins.cx); ring2.setAttribute('cy', ins.cy); ring2.setAttribute('r', rr - 3.5 * S); ring2.setAttribute('stroke-width', 2 * S);
      OV.marks[i].setAttribute('cx', mx); OV.marks[i].setAttribute('cy', my); OV.marks[i].setAttribute('r', mr); OV.marks[i].setAttribute('stroke-width', 3 * S + 0.5);
      const show = dl > rr + mr + 4;
      OV.leads[i].style.display = show ? '' : 'none';
      OV.leads[i].setAttribute('x1', ins.cx + dx / dl * rr); OV.leads[i].setAttribute('y1', ins.cy + dy / dl * rr);
      OV.leads[i].setAttribute('x2', mx - dx / dl * mr); OV.leads[i].setAttribute('y2', my - dy / dl * mr);
      OV.leads[i].setAttribute('stroke-width', 3 * S + 0.5);
      [ring, ring2, OV.leads[i], OV.marks[i]].forEach(e => { e.style.opacity = String(pxScale); });
    });
    hideOverlay(insets.length);
    renderer.autoClear = false; renderer.clearDepth();
    renderer.render(oScene, oCam);
    renderer.autoClear = true;
  } else hideOverlay(0);
  drawTags(pg, L, tau, !!opts.settled, aOut, showModel);
  if (showModel && L.finalRect) drawFinal(R, pg, L, aOut); else finalEl.style.opacity = '0';
  R.pivot.visible = showModel;
  flashEl.style.opacity = String(opts.flash || 0);
  /* rotating identity-card thumbnails */
  if (pg.spins && pg.spins.length) {
    const fr = Math.floor(tau / SPIN_T * SPIN_N) % SPIN_N;
    if (pg.spinF !== fr) { pg.spinF = fr; const pos = `${(fr / (SPIN_N - 1) * 100).toFixed(3)}% 0`; pg.spins.forEach(e => { e.style.backgroundPosition = pos; }); }
  }
}

/* ---------- video timeline ---------- */
let STARTS = [], DURATION = 0;
function buildTimeline() { STARTS = []; let t = 0; PAGES.forEach(p => { STARTS.push(t); t += pageDur(p); }); DURATION = t; }
function renderTimeline(t) {
  t = Math.max(0, Math.min(fin(t), DURATION - 1e-4));
  let g = 0;
  while (g < PAGES.length - 1 && t >= STARTS[g + 1]) g++;
  const tau = t - STARTS[g], pg = PAGES[g], dur = pageDur(pg);
  let from = null;
  if (g > 0 && PAGES[g - 1].R === pg.R) { const p = PAGES[g - 1], Lp = pageLayout(g - 1); from = { cam: Lp.main, angle: pageAngle(p, pageDur(p)), panel: pg.s && p.s && pg.s.subassembly && pg.s.subassembly === p.s.subassembly ? Lp.panel : null }; }
  let flash = 0;
  const first = g === 0 || PAGES[g - 1].R !== pg.R, last = g === PAGES.length - 1 || PAGES[g + 1].R !== pg.R;
  if (first) flash = Math.max(flash, 1 - clamp01(tau / FLASH));
  if (last && g !== PAGES.length - 1) flash = Math.max(flash, clamp01((tau - (dur - FLASH)) / FLASH));
  drawPage(g, tau, { from, pageDur: dur, flash });
}

/* ---------- interactive ---------- */
let controls;
let cur = 0, pageStart = 0, from = null, arrivedBack = false, userCam = false, seekDriven = false;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const now = () => performance.now() / 1000;
function hashFor(g) { const pg = PAGES[g]; return '#' + pg.R.def.letter + (pg.type === 'cover' ? '0' : pg.type === 'done' ? 'done' : pg.s.step + '.' + (pg.type === 'intro' ? 0 : pg.s.k)); }
function pageFromHash(h) {
  const m = /^#?([AB])(?:(\d+)(?:\.(\d+))?|(done|cover))?$/i.exec(decodeURIComponent(h || ''));
  if (!m) return 0;
  const R = RB.find(r => r.def.letter === m[1].toUpperCase());
  if (m[4] && m[4].toLowerCase() === 'done') return PAGES.findIndex(p => p.R === R && p.type === 'done');
  const st = m[2] ? parseInt(m[2], 10) : 0, k = m[3] ? parseInt(m[3], 10) : 1;
  if (!st) return PAGES.findIndex(p => p.R === R && p.type === 'cover');
  if (m[3] === '0') { const ii = PAGES.findIndex(p => p.R === R && p.type === 'intro' && p.s.step === st); if (ii >= 0) return ii; }
  let idx = PAGES.findIndex(p => p.R === R && p.s && p.type !== 'intro' && p.s.step === st && p.s.k === k);
  if (idx < 0) idx = PAGES.findIndex(p => p.R === R && p.s && p.s.step === st);
  return idx < 0 ? 0 : idx;
}
function go(g, opts = {}) {
  g = Math.max(0, Math.min(PAGES.length - 1, g));
  seekDriven = false;
  const old = cur, oldPg = PAGES[old], pg = PAGES[g];
  const sameRobot = oldPg.R === pg.R;
  from = sameRobot && curApplied && g !== old ? { cam: curApplied.cam, angle: curApplied.angle, panel: curApplied.panel && pg.s && oldPg.s && pg.s.subassembly && pg.s.subassembly === oldPg.s.subassembly ? curApplied.panel : null } : null;
  arrivedBack = sameRobot && g < old;
  if (!sameRobot || g !== old) userCam = false;
  cur = g;
  pageStart = reduceMotion ? now() - 60 : now();
  if (!opts.noHash) history.replaceState(null, '', hashFor(g));
  updateChrome();
}
const STRIP_ICON = { cover: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6" stroke-linecap="round"/></svg>`, done: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>` };
function updateChrome() {
  const pg = PAGES[cur];
  document.getElementById('back').disabled = cur === 0;
  document.getElementById('next').disabled = cur === PAGES.length - 1;
  document.querySelectorAll('#switch button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.r === pg.R.def.key)));
  const strip = document.getElementById('strip');
  if (strip.dataset.r !== pg.R.def.key) {
    strip.dataset.r = pg.R.def.key; strip.innerHTML = '';
    const add = (label, html, gi, key) => { const b = el('button', '', html); b.dataset.g = gi; b.dataset.k = key; b.setAttribute('aria-label', label); b.addEventListener('click', () => go(gi)); strip.appendChild(b); };
    const R = pg.R;
    add('Cover', STRIP_ICON.cover, PAGES.findIndex(p => p.R === R && p.type === 'cover'), 'c');
    const seen = new Set();
    PAGES.forEach((p, i) => { if (p.R === R && p.s && !seen.has(p.s.step)) { seen.add(p.s.step); add(`Step ${p.s.step}`, String(p.s.step), i, 's' + p.s.step); } });
    add('Finished robot and parts list', STRIP_ICON.done, PAGES.findIndex(p => p.R === R && p.type === 'done'), 'd');
  }
  const key = pg.type === 'cover' ? 'c' : pg.type === 'done' ? 'd' : 's' + pg.s.step;
  strip.querySelectorAll('button').forEach(b => {
    if (b.dataset.k === key) { b.setAttribute('aria-current', 'step'); b.scrollIntoView({ block: 'nearest', inline: 'nearest' }); } else b.removeAttribute('aria-current');
  });
  document.getElementById('robotlabel').innerHTML = `<b>${pg.R.def.letter}</b>${esc(pg.R.name)}`;
}
function renderInteractive() {
  const tau = now() - pageStart;
  if (userCam) controls.update();
  drawPage(cur, tau, { from, settled: arrivedBack, pageDur: Infinity, userCam });
  if (from && tau > CAM_LERP) from = null;
}
function setNotes(on) {
  stage.classList.toggle('notes', on);
  document.getElementById('aa').setAttribute('aria-pressed', String(on));
  try { localStorage.setItem('manual-notes', on ? '1' : '0'); } catch (e) { /* storage optional */ }
  camCache.clear();
}

/* ---------- boot ---------- */
async function boot() {
  if (VIDEO) document.body.classList.add('video');
  controls = new OrbitControls(camera, canvas);
  controls.enableDamping = false; controls.enablePan = false;
  controls.minDistance = 40; controls.maxDistance = 4000;
  controls.addEventListener('start', () => { userCam = true; });
  controls.enabled = !VIDEO;
  initOverlay();

  RB = [];
  for (const def of ROBOTS) RB.push(await buildRobot(def));
  scene.updateMatrixWorld(true);
  await buildThumbs();
  buildPages();
  for (const pg of PAGES) {
    panelsEl.appendChild(pg.panel); if (pg.card) panelsEl.appendChild(pg.card);
    pg.spins = [...pg.panel.querySelectorAll('.spin:not(.still)')];
    pg.panel.querySelectorAll('[data-tag]').forEach(t => {
      t.addEventListener('pointerenter', () => { hoverKey = t.dataset.tag; hoverEl = t; });
      t.addEventListener('pointerleave', () => { if (hoverEl === t) { hoverKey = null; hoverEl = null; } });
    });
  }
  ['ln', 'dn', 'lo', 'dO', 'hv'].forEach(k => { TL[k] = document.getElementById({ ln: 'tln', dn: 'tdn', lo: 'tlo', dO: 'tdo', hv: 'thv' }[k]); });
  for (const pg of PAGES) if (pg.card) {
    pg.wl = [...pg.card.querySelectorAll('.wl')];
    pg.wlLen = pg.wl.map(p => { try { return Math.ceil(p.getTotalLength()) + 2; } catch (e) { return 1000; } });
    pg.wt = [...pg.card.querySelectorAll('.wt')];
  }
  buildTimeline();

  const sw = document.getElementById('switch');
  RB.forEach(R => {
    const b = el('button', '', `${R.def.letter}<span>${esc(R.name)}</span>`);
    b.dataset.r = R.def.key;
    b.addEventListener('click', () => go(PAGES.findIndex(p => p.R === R)));
    sw.appendChild(b);
  });
  document.getElementById('back').addEventListener('click', () => go(cur - 1));
  document.getElementById('next').addEventListener('click', () => go(cur + 1));
  document.getElementById('reset').addEventListener('click', () => { userCam = false; from = null; seekDriven = false; });
  document.getElementById('replay').addEventListener('click', () => { pageStart = now(); arrivedBack = false; userCam = false; seekDriven = false; });
  let notes = QS.get('notes') === '1';
  if (!VIDEO && !QS.has('notes')) { try { notes = localStorage.getItem('manual-notes') === '1'; } catch (e) { notes = false; } }
  setNotes(notes && !VIDEO);
  document.getElementById('aa').addEventListener('click', () => setNotes(!stage.classList.contains('notes')));
  const setAll = on => { showAll = on; document.getElementById('names').setAttribute('aria-pressed', String(on)); };
  document.getElementById('names').addEventListener('click', () => setAll(!showAll));
  addEventListener('keydown', e => {
    if (VIDEO || e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); go(cur + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); go(cur - 1); }
    else if (e.key === 'n' || e.key === 'N') { e.preventDefault(); setAll(!showAll); }
  });
  addEventListener('hashchange', () => { if (!VIDEO) { const g = pageFromHash(location.hash); if (g !== cur) go(g, { noHash: true }); } });
  addEventListener('resize', () => { layout(); });

  layout();
  try { await Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 3000))]); } catch (e) { /* fonts optional */ }
  await Promise.all([...new Set([...document.querySelectorAll('#panels .spin')].map(e => e.style.backgroundImage.slice(5, -2)))].map(u => { const im = new Image(); im.src = u; return im.decode().catch(() => {}); }));
  camCache.clear();

  window.__duration = DURATION;
  window.__seek = t => { seekDriven = true; renderTimeline(Number(t)); return true; };
  window.__go = g => go(g);
  if (QS.get('debug') === '1') window.__dbg = { THREE, renderer, scene, keyLight, CLIP, RB, PAGES, ghostMat, setAll: v => { showAll = v; } };
  window.__pages = () => PAGES.map((p, i) => ({ i, hash: hashFor(i), type: p.type, start: STARTS[i], dur: pageDur(p) }));

  document.getElementById('loading').remove();
  if (!VIDEO) { cur = pageFromHash(location.hash); go(cur, { noHash: !location.hash }); }
  const playStart = now();
  const loop = () => {
    requestAnimationFrame(loop);
    if (seekDriven) return;
    if (VIDEO) renderTimeline((now() - playStart) % DURATION);
    else renderInteractive();
  };
  if (VIDEO) renderTimeline(0); else renderInteractive();
  window.__ready = true;
  requestAnimationFrame(loop);
}
boot().catch(err => {
  const l = document.getElementById('loading');
  if (l) { l.textContent = 'Could not load the build manual: ' + (err && err.message ? err.message : err); l.classList.add('err'); }
  console.error(err);
});
</script>
