<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>How our robots think</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=block" rel="stylesheet">
<style>
:root{--bg:#04070d;--hud:rgba(11,17,29,.92);--fg:#e9eef5;--mute:#97a3b6;--acc:#3fd5e6}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
#cv{position:absolute;display:block}
#hud{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;
  padding:8px 14px;background:var(--hud);border:1px solid #27344b;border-radius:10px;color:var(--fg);
  font:13px/1 "JetBrains Mono",Consolas,monospace;opacity:0;transition:opacity .35s ease;width:min(720px,calc(100vw - 32px));box-sizing:border-box}
#hud.on{opacity:1}
#hud button{background:none;border:1px solid #33425c;color:var(--fg);border-radius:6px;width:34px;height:28px;cursor:pointer;font:inherit}
#hud input{flex:1;accent-color:var(--acc);min-width:0}
#hud span{color:var(--mute);white-space:nowrap}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud"><button id="pp" aria-label="Play or pause">&#9654;</button><input id="scrub" type="range" min="0" max="150" step="0.01" value="0" aria-label="Timeline"><span id="tc">0:00 / 2:30</span></div>
<script>
'use strict';
const SRC_A = "/******************************************************************************\n * Robot A - \"Duck Runner\"                                   2026 Fall Game\n * KIPR Wombat, 4 gear motors on mecanum wheels, 3 servo flaps, tophats.\n *\n * Implements Robot A's route of plan v3 (tools/match_plan.py, checked by\n * tools/match_sim.py: no contact with Robot B or any piece it must not touch).\n * Starts in Zone 5 (large box). Every number marked CALIBRATE was budgeted,\n * not measured: tune it on the real robot before trusting the timeline.\n *\n * Motor ports follow last season's wiring (Botball robotics 2025_26.pdf):\n *   FR 0, FL 1, BR 2, BL 3.  Encoder: 1870 ticks per wheel revolution.\n *****************************************************************************/\n#include <kipr/wombat.h>\n#include <stdio.h>\n#include <stdlib.h>    /* abs, labs */\n#include <math.h>\n\n/* ---------------------------------------------------------------- ports */\n#define FR 0\n#define FL 1\n#define BR 2\n#define BL 3\n#define SERVO_GATE_C   0      /* intake flap, front            (regular servo) */\n#define SERVO_GATE_B   1      /* pin flap, one duck from rear  (micro servo)   */\n#define SERVO_GATE_A   2      /* exit flap, rear               (regular servo) */\n#define TOPHAT_L       0      /* analog: left tape sensor at the lane mouth    */\n#define TOPHAT_R       1      /* analog: right tape sensor                     */\n#define ET_FRONT       2      /* analog: ET rangefinder looking forward        */\n#define LIGHT_START    3      /* analog: starting-light sensor                 */\n#define TOUCH_LANE     0      /* digital: pressed when the 5th duck is in      */\n\n/* ---------------------------------------------------------------- calibration */\n#define TICKS_PER_REV   1870.0\n#define WHEEL_DIAM_IN   2.36                 /* CALIBRATE: 60 mm mecanum; last year's wheels were 3.0 */\n#define TICKS_PER_INCH  (TICKS_PER_REV / (M_PI * WHEEL_DIAM_IN))\n#define STRAFE_FACTOR   1.15                 /* CALIBRATE: mecanum wheels slip sideways */\n#define TAPE_THRESHOLD  2700                 /* CALIBRATE: analog (12-bit) < this = black (last year 2700) */\n#define LIGHT_ON        770                  /* CALIBRATE: analog < this = light on (last year 770) */\n#define SPEED_FAST      80\n#define SPEED_LINE      45                   /* line-following speed while swallowing ducks */\n#define SPEED_SLOW      30\n#define MATCH_END_S     118                  /* hard stop; rules DQ a robot still moving at 120 */\n\n/* Hand-off times (s after the light). The robots do not talk to each other, so every\n   \"wait for the other robot\" is a fixed time. Same values as T_* in tools/match_plan.py,\n   each padded past the moment the simulation says it is safe. CALIBRATE on the table. */\n#define T_A_EAST   12.0      /* B has dragged the lower cup west and backed off it  */\n#define T_A_WEST   60.0      /* B has left Zone 3 for the bottom wall               */\n#define T_A_DOWN   66.0      /* B is parked at the platform                         */\n\n/* servo positions, CALIBRATE on the built flaps */\n#define GATE_OPEN    1900\n#define GATE_CLOSED  1000\n\n/* ---------------------------------------------------------------- mecanum base */\n/* vx: + forward (east at start), vy: + left (north at start), w: + counter-clockwise */\nstatic void mecanum(int vx, int vy, int w) {\n    /* Each wheel is a sum of up to three terms, so a mix can exceed motor()'s -100..100\n       range. Scale all four together rather than letting motor() clip them one by one:\n       clipping per wheel would silently bend the commanded direction. */\n    int m[4] = { vx - vy - w, vx + vy + w, vx + vy - w, vx - vy + w };   /* FL, FR, BL, BR */\n    int peak = 0;\n    for (int i = 0; i < 4; i++)\n        if (abs(m[i]) > peak) peak = abs(m[i]);\n    if (peak > 100)\n        for (int i = 0; i < 4; i++) m[i] = m[i] * 100 / peak;\n    motor(FL, m[0]);\n    motor(FR, m[1]);\n    motor(BL, m[2]);\n    motor(BR, m[3]);\n}\nstatic void stop_all(void) { ao(); }\n\nstatic double t_light;                 /* seconds() when the start light came on */\n\n/* wait until t seconds after the start light */\nstatic void wait_until_s(double t) {\n    if (seconds() - t_light > t)       /* late: the hand-off is no longer guaranteed safe */\n        printf(\"late for the %.0f s hand-off: t=%.1f s\\n\", t, seconds() - t_light);\n    while (seconds() - t_light < t) msleep(20);\n}\n\n/* Drive a straight distance in inches; dx forward, dy left. Pass exactly one non-zero:\n   direction is quantised to the sign of dx/dy and the tick target is |dx|+|dy|, so a\n   diagonal call drives 45 deg for a Manhattan distance and misses the waypoint. Split\n   diagonals into two calls at the call site. */\nstatic void move_in(double dx, double dy, int speed) {\n    double dist = fabs(dx) + fabs(dy);\n    double factor = (dy != 0) ? STRAFE_FACTOR : 1.0;\n    long target = (long)(dist * TICKS_PER_INCH * factor);\n    int vx = (dx > 0) - (dx < 0), vy = (dy > 0) - (dy < 0);\n    cmpc(FL);\n    mecanum(vx * speed, vy * speed, 0);\n    while (labs(gmpc(FL)) < target && seconds() < MATCH_END_S) msleep(5);\n    stop_all();\n    if (labs(gmpc(FL)) < target)   /* ran out of match clock: say so, or the rest of the run\n                                      silently no-ops and the log shows nothing wrong */\n        printf(\"move_in(%.1f, %.1f) stopped at %ld/%ld ticks, t=%.1f s\\n\",\n               dx, dy, labs(gmpc(FL)), target, seconds());\n    msleep(150);\n}\n\n/* keep the lane mouth on the centre tape while creeping east, until the lane is full */\nstatic void follow_tape_east(double inches, int speed) {\n    long target = (long)(inches * TICKS_PER_INCH);\n    cmpc(FL);\n    /* the touch switch at the rear of the lane is the real stop condition; the distance\n       is only the backstop for a switch that never trips */\n    while (labs(gmpc(FL)) < target && !digital(TOUCH_LANE) && seconds() < MATCH_END_S) {\n        int l = analog(TOPHAT_L) < TAPE_THRESHOLD;\n        int r = analog(TOPHAT_R) < TAPE_THRESHOLD;\n        if (l && !r)      mecanum(speed, +20, 0);   /* drifted right: nudge left  */\n        else if (r && !l) mecanum(speed, -20, 0);   /* drifted left: nudge right  */\n        else              mecanum(speed, 0, 0);\n        msleep(10);\n    }\n    stop_all();\n    printf(\"follow_tape_east: %ld/%ld ticks, lane full=%d, t=%.1f s\\n\",\n           labs(gmpc(FL)), target, digital(TOUCH_LANE), seconds());\n}\n\n/* ---------------------------------------------------------------- escapement */\nstatic void gates_init(void) {\n    set_servo_position(SERVO_GATE_C, GATE_OPEN);     /* intake open while collecting */\n    set_servo_position(SERVO_GATE_B, GATE_OPEN);\n    set_servo_position(SERVO_GATE_A, GATE_CLOSED);   /* exit shut */\n}\n\n/* release exactly one duck: pin holds duck #2, exit opens, robot creeps forward, exit shuts */\nstatic void drop_one_duck(void) {\n    set_servo_position(SERVO_GATE_B, GATE_CLOSED);   /* pin the second duck from the rear */\n    msleep(300);\n    set_servo_position(SERVO_GATE_A, GATE_OPEN);\n    msleep(300);\n    move_in(2.5, 0, SPEED_SLOW);                     /* lane slides over the rear duck, it stays */\n    set_servo_position(SERVO_GATE_A, GATE_CLOSED);\n    msleep(250);\n    set_servo_position(SERVO_GATE_B, GATE_OPEN);     /* remaining ducks settle to the rear */\n    msleep(400);\n}\n\n/* ---------------------------------------------------------------- main */\nint main(void) {\n    enable_servos();\n    gates_init();\n    printf(\"Robot A ready. Waiting for the light.\\n\");\n    while (analog(LIGHT_START) > LIGHT_ON) msleep(10);   /* wait_for_light(LIGHT_START) also works */\n    t_light = seconds();\n    shut_down_in(119.0);                                  /* safety: everything off before 120 s */\n\n    /* Plan v3 (tools/match_plan.py, collision-checked by tools/match_sim.py). Frame: inches\n       from the inside corner of the bottom-left PVC; A starts in Zone 5 at (28.5, 5.7)\n       facing east. Every move is one axis-aligned leg: move_in() cannot drive diagonals. */\n\n    /* 0-3 s: north out of Zone 5, then west, out of the way of B's cup drag along y 12 */\n    move_in(0, 12.2, SPEED_FAST);                                  /* -> (28.5, 17.9) */\n    move_in(-14.2, 0, SPEED_FAST);                                 /* -> (14.3, 17.9) */\n    wait_until_s(T_A_EAST);\n\n    /* side-push the red pom stack and the upper cup north into Zone 1 */\n    move_in(25.0, 0, SPEED_FAST);                                  /* -> (39.3, 17.9), under the red stack */\n    move_in(0, 10.7, SPEED_SLOW);                                  /* -> (39.3, 28.6): stack + cup go north */\n    move_in(0, -3.2, SPEED_FAST);                                  /* -> (39.3, 25.4), lane mouth on the tape */\n\n    /* swallow the five ducks, line-following east */\n    follow_tape_east(36.6, SPEED_LINE);                            /* -> (75.9, 25.4), or the touch switch */\n    set_servo_position(SERVO_GATE_C, GATE_CLOSED);\n\n    /* the lane is first in, first out: red leaves first */\n    move_in(0, 7.6, SPEED_FAST);                                   /* -> (75.9, 33) */\n    drop_one_duck();                                               /* Zone 2: red duck at ~(70.6, 33) */\n    move_in(0, -15.4, SPEED_FAST);                                 /* -> (78.4, 17.6) */\n    move_in(-1.0, 0, SPEED_SLOW);                                  /* -> (77.4, 17.6) */\n    drop_one_duck();                                               /* Zone 4: green duck at ~(72.1, 17.6) */\n    move_in(0, 7.3, SPEED_FAST);                                   /* -> (79.9, 24.9) */\n    move_in(-30.6, 0, SPEED_FAST);                                 /* -> (49.3, 24.9), west along the empty lane */\n    move_in(0, 3.3, SPEED_FAST);                                   /* -> (49.3, 28.2) */\n    drop_one_duck();                                               /* Zone 1: lavender duck at ~(44, 28.2) */\n    move_in(0, -7.2, SPEED_FAST);                                  /* -> (51.8, 21) */\n    move_in(0.8, 0, SPEED_SLOW);                                   /* -> (52.6, 21), wait clear of B's descent */\n    wait_until_s(T_A_WEST);\n\n    move_in(-14.1, 0, SPEED_FAST);                                 /* -> (38.5, 21), through Zone 3 */\n    wait_until_s(T_A_DOWN);\n    move_in(0, -14.2, SPEED_FAST);                                 /* -> (38.5, 6.8), into Zone 5 */\n    drop_one_duck();                                               /* Zone 5: blue duck at ~(33.2, 6.8) */\n    move_in(0, 14.2, SPEED_FAST);                                  /* -> (41, 21) */\n    drop_one_duck();                                               /* Zone 3: yellow duck at ~(35.7, 21) */\n\n    stop_all();\n    disable_servos();\n    printf(\"Robot A done at %.1f s\\n\", seconds());\n    return 0;\n}";
const SRC_B = "/******************************************************************************\n * Robot B - \"Point Scorer\"                                  2026 Fall Game\n * KIPR Wombat, 2 gear motors (differential), servo arm + geared claw (print 2,\n * driven by a standard servo), cup-hook servo, camera, 2 tophats, ET, plow lever.\n *\n * Implements Robot B's route of plan v3 (tools/match_plan.py, checked by\n * tools/match_sim.py): starts in the small box facing west at (63.8, 7.15);\n *   lower cup dragged west + flipped into Zone 5 -> red pom -> 4 pom stacks\n *   -> pickleball 1 -> red pom on the platform.\n * B's first run stays south of the duck lane: it never comes near a duck.\n * Numbers marked CALIBRATE were budgeted, not measured.\n *\n * Servo values are last season's measured ones (Botball robotics 2025_26.pdf)\n * for the same arm/claw servos; re-check after rebuilding.\n *****************************************************************************/\n#include <kipr/wombat.h>\n#include <stdio.h>\n#include <stdlib.h>    /* labs */\n#include <math.h>\n\n/* ---------------------------------------------------------------- ports */\n#define LEFT   0\n#define RIGHT  2\n#define SERVO_ARM    1            /* shoulder (regular servo)      */\n#define SERVO_CLAW   2            /* geared claw (standard servo)  */\n#define SERVO_HOOK   3            /* cup hook on the right side    */\n#define TOPHAT_L     0\n#define TOPHAT_R     1\n#define ET_FRONT     2\n#define LIGHT_START  3\n#define LEVER_PLOW   0            /* digital: plow touched something */\n#define CAM_RED      0            /* camera channel 0 = find_red.conf, as last year */\n\n/* ---------------------------------------------------------------- calibration */\n#define TICKS_PER_REV   1870.0\n#define WHEEL_DIAM_IN   2.75               /* CALIBRATE: Solarbotics wheel; last year's were 3.0 */\n#define TICKS_PER_INCH  (TICKS_PER_REV / (M_PI * WHEEL_DIAM_IN))\n#define TICKS_PER_DEG   13.0               /* CALIBRATE: last year's pivot constant (angle * 13) */\n#define TRACK_IN        6.06               /* CALIBRATE: wheel centre to wheel centre (154 mm) */\n#define TAPE_THRESHOLD  2700               /* CALIBRATE: analog (12-bit) < this = black */\n#define LIGHT_ON        770\n#define SPEED_FAST      80\n#define SPEED_PUSH      45\n#define MATCH_END_S     118\n\n/* Hand-off time (s after the light): A has swallowed the ducks past the centre line.\n   Same as T_B_north in tools/match_plan.py, padded past the safe moment. CALIBRATE. */\n#define T_B_NORTH       26.0\n\n#define ARM_UP        860                  /* measured last season */\n#define ARM_DOWN     1750\n#define ARM_PLATFORM  600                  /* CALIBRATE: claw above the 5.7 in platform edge */\n#define CLAW_OPEN    2000                  /* CALIBRATE: geared claw on a standard servo now */\n#define CLAW_CLOSED  1200\n#define HOOK_UP      1000                  /* CALIBRATE */\n#define HOOK_DOWN    1900\n\n/* ---------------------------------------------------------------- base */\nstatic void drive(int l, int r) { motor(LEFT, l); motor(RIGHT, r); }\nstatic void stop_all(void) { ao(); }\n\nstatic void forward_in(double inches, int speed) {\n    long target = (long)(fabs(inches) * TICKS_PER_INCH);\n    int s = inches < 0 ? -speed : speed;\n    cmpc(LEFT);\n    drive(s, s);\n    while (labs(gmpc(LEFT)) < target && seconds() < MATCH_END_S) msleep(5);\n    stop_all();\n    if (labs(gmpc(LEFT)) < target)   /* ran out of match clock: say so, or every later move\n                                        silently no-ops and the log shows nothing wrong */\n        printf(\"forward_in(%.1f) stopped at %ld/%ld ticks, t=%.1f s\\n\",\n               inches, labs(gmpc(LEFT)), target, seconds());\n    msleep(150);\n}\n/* positive = counter-clockwise (turn left), in place */\nstatic void turn_deg(double deg, int speed) {\n    long target = (long)(fabs(deg) * TICKS_PER_DEG);\n    cmpc(LEFT);\n    if (deg > 0) drive(-speed, speed); else drive(speed, -speed);\n    while (labs(gmpc(LEFT)) < target && seconds() < MATCH_END_S) msleep(5);\n    stop_all();\n    if (labs(gmpc(LEFT)) < target)\n        printf(\"turn_deg(%.1f) stopped at %ld/%ld ticks, t=%.1f s\\n\",\n               deg, labs(gmpc(LEFT)), target, seconds());\n    msleep(200);\n}\n/* arc of a given radius (inches, to the robot centre); deg > 0 = left (CCW), as turn_deg */\nstatic void arc_r(double radius, double deg, int speed) {\n    double ro = radius + TRACK_IN / 2, ri = radius - TRACK_IN / 2;\n    int inner = (int)(speed * ri / ro);\n    long target = (long)(fabs(deg) * M_PI / 180.0 * ro * TICKS_PER_INCH);   /* outer wheel path */\n    int outer_port = deg > 0 ? RIGHT : LEFT;\n    cmpc(outer_port);\n    if (deg > 0) drive(inner, speed); else drive(speed, inner);\n    while (labs(gmpc(outer_port)) < target && seconds() < MATCH_END_S) msleep(5);\n    stop_all();\n    if (labs(gmpc(outer_port)) < target)\n        printf(\"arc_r(%.1f, %.1f) stopped short, t=%.1f s\\n\", radius, deg, seconds());\n    msleep(150);                 /* settle, as forward_in and turn_deg do */\n}\n\nstatic double t_light;          /* seconds() when the start light came on */\n\n/* wait until t seconds after the start light */\nstatic void wait_until_s(double t) {\n    if (seconds() - t_light > t)       /* late: the hand-off is no longer guaranteed safe */\n        printf(\"late for the %.0f s hand-off: t=%.1f s\\n\", t, seconds() - t_light);\n    while (seconds() - t_light < t) msleep(20);\n}\n\n/* ---------------------------------------------------------------- tools */\n/* The hook catches the upside-down lower cup's rim and drags it west along the lower\n   tape; a 20 deg pivot to the left then rolls it upright off the tape (the right plow\n   wing pushes its base). CALIBRATE the hook height on the real cup. */\nstatic void drag_and_flip_cup(double drag_in) {\n    set_servo_position(SERVO_HOOK, HOOK_DOWN);\n    msleep(300);\n    forward_in(drag_in, SPEED_PUSH);\n    turn_deg(+20, SPEED_PUSH);\n    set_servo_position(SERVO_HOOK, HOOK_UP);\n    msleep(300);\n}\n\n/* Find the red pom with the camera, centre on it, grab it. Returns 1 on success.\n   Everything after this call is dead reckoning from the pre-scan pose, so the scan\n   rotation and the approach are both undone before returning, on success and failure\n   alike. Without that, a pom that is a few degrees off frame leaves the robot facing\n   an arbitrary direction for the whole rest of the match. */\nstatic int grab_red_pom(void) {\n    set_servo_position(SERVO_CLAW, CLAW_OPEN);\n    set_servo_position(SERVO_ARM, ARM_DOWN);\n    msleep(400);\n    camera_open();\n    const int CAM_TRIES = 40;                                /* x 100 ms = ~4 s budget */\n    int found = 0;\n    cmpc(LEFT);                                              /* net scan rotation, in ticks */\n    for (int tries = 0; tries < CAM_TRIES && !found; tries++) {\n        camera_update();\n        if (get_object_count(CAM_RED) > 0) {\n            int x = get_object_center_x(CAM_RED, 0);        /* 0..159 */\n            if (x < 70)       drive(-25, 25);\n            else if (x > 90)  drive(25, -25);\n            else { found = 1; stop_all(); }\n        } else {\n            drive(-25, 25);                                  /* scan */\n        }\n        msleep(100);\n    }\n    camera_close();\n    stop_all();\n    long spun = gmpc(LEFT);                                  /* signed: which way we turned */\n    if (found) {\n        forward_in(2.0, 30);\n        set_servo_position(SERVO_CLAW, CLAW_CLOSED);\n        msleep(400);\n        set_servo_position(SERVO_ARM, ARM_UP);\n        msleep(400);\n        forward_in(-2.0, 30);                                /* undo the approach */\n    } else {\n        printf(\"red pom not seen in %d camera frames\\n\", CAM_TRIES);\n        set_servo_position(SERVO_ARM, ARM_UP);\n    }\n    /* unwind the scan rotation back to the heading the caller assumes */\n    if (labs(spun) > 20) {\n        cmpc(LEFT);\n        if (spun > 0) drive(-25, 25); else drive(25, -25);   /* spun>0 = turned right: turn back left */\n        while (labs(gmpc(LEFT)) < labs(spun) && seconds() < MATCH_END_S) msleep(5);\n        stop_all();\n        msleep(200);\n    }\n    return found;\n}\n\n/* facing north on the travel line: push one pom stack into Zone 1 and back off */\nstatic void push_stack_north(double push_in) {\n    forward_in(push_in, SPEED_PUSH);\n    forward_in(-push_in, SPEED_FAST);\n}\n\n/* ---------------------------------------------------------------- main */\nint main(void) {\n    enable_servos();\n    set_servo_position(SERVO_ARM, ARM_UP);\n    set_servo_position(SERVO_CLAW, CLAW_OPEN);\n    set_servo_position(SERVO_HOOK, HOOK_UP);\n    printf(\"Robot B ready. Waiting for the light.\\n\");\n    while (analog(LIGHT_START) > LIGHT_ON) msleep(10);\n    t_light = seconds();\n    shut_down_in(119.0);\n\n    /* 0-7 s: the lower cup (hook side = right = north while facing west) */\n    forward_in(8.4, SPEED_PUSH);                /* (63.8, 7.15) -> (55.4, 7.15): hook meets the cup */\n    drag_and_flip_cup(18.4);                    /* -> (37, 7.15); cup upright at ~(27, 8.9), its poms spill */\n    forward_in(-2.5, SPEED_FAST);               /* back off along 200 deg -> (39.4, 8.0) */\n    turn_deg(-20, SPEED_FAST);                  /* square up facing west */\n    forward_in(-2.45, SPEED_FAST);              /* -> (41.8, 8.0): claw clear of the cup */\n\n    /* 7-10 s: the red pom */\n    int have_red = grab_red_pom();\n    if (!have_red) printf(\"red pom not found, skipping the platform\\n\");\n\n    /* wait (holding the pom) until A has swallowed the ducks past the centre line */\n    wait_until_s(T_B_NORTH);\n    turn_deg(-90, SPEED_FAST);                  /* facing west -> clockwise 90 = face north */\n    forward_in(9.5, SPEED_FAST);                /* -> (41.8, 17.5), the Zone 3 travel line */\n    turn_deg(+90, SPEED_FAST);                  /* face west */\n\n    /* 4 pom stacks, east to west, each pushed north into Zone 1 (A already moved the red one) */\n    const double stack_x[4] = { 32.0, 24.0, 16.0, 11.0 };     /* B centre; the gold stack is at x 8 */\n    const double push_in[4] = { 9.48, 9.48, 9.48, 5.48 };      /* gold only to y 29: clears turquoise */\n    double x = 41.8;\n    for (int k = 0; k < 4; k++) {\n        forward_in(x - stack_x[k], SPEED_FAST);\n        x = stack_x[k];\n        turn_deg(-90, SPEED_FAST);              /* face north */\n        push_stack_north(push_in[k]);\n        if (k < 3) turn_deg(+90, SPEED_FAST);   /* face west again */\n    }\n\n    /* down to the bottom wall east of the cup, then east to pickleball 1 */\n    turn_deg(-90, SPEED_FAST);                  /* north -> east at (11, 17.5) */\n    forward_in(21.5, SPEED_FAST);               /* -> (32.5, 17.5) */\n    arc_r(5.0, -90, SPEED_PUSH);                /* -> (37.5, 12.5) facing south */\n    arc_r(4.9, +90, SPEED_PUSH);                /* -> (42.4, 7.6) facing east */\n    set_servo_position(SERVO_HOOK, HOOK_DOWN);  /* hook sweeps the ball off its post */\n    forward_in(2.5, SPEED_PUSH);\n    set_servo_position(SERVO_HOOK, HOOK_UP);\n    forward_in(14.0, SPEED_PUSH);               /* -> (58.9, 7.6): ball rolls under the platform */\n\n    /* red pom alone on the platform (the big duck is allowed next to it) */\n    if (have_red) {\n        set_servo_position(SERVO_ARM, ARM_PLATFORM);\n        msleep(1200);\n        set_servo_position(SERVO_CLAW, CLAW_OPEN);\n        msleep(400);\n        set_servo_position(SERVO_ARM, ARM_UP);\n    }\n\n    stop_all();\n    disable_servos();\n    printf(\"Robot B done at %.1f s\\n\", seconds() - t_light);\n    return 0;\n}";

const W = 1920, H = 1080, PI = Math.PI;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const COL = {bg:'#070b13', panel:'#0b111d', panel2:'#0f1727', line:'#1a2436', line2:'#2a3750', text:'#e9eef5',
  mute:'#97a3b6', dim:'#66728a', faint:'#38445a', A:'#3fd5e6', B:'#f5ab3d', red:'#ef5a62', field:'#d9dde3',
  wall:'#9aa2ad', tape:'#17191d', code:'#cdbcff', Atrail:'#0b98ab', Btrail:'#c97f0c'};
const SANS = 'Inter, "Segoe UI", system-ui, sans-serif', MONO = '"JetBrains Mono", Consolas, monospace';
const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eio = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const eo = u => 1 - Math.pow(1 - u, 3);
const sstep = (a, b, x) => { const u = clamp((x - a) / (b - a)); return u * u * (3 - 2 * u); };
const win = (t, a, b, fi = .45, fo = .45) => Math.min(sstep(a, a + fi, t), 1 - sstep(b - fo, b, t));
const angD = (a, b) => { let d = ((b - a) % 360 + 540) % 360 - 180; return d; };
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; };
const font = (sz, w = 400, mono = false) => `${w} ${sz}px ${mono ? MONO : SANS}`;

function T(str, x, y, o = {}) {
  ctx.save();
  ctx.font = font(o.size || 16, o.weight || 400, o.mono);
  ctx.fillStyle = o.color || COL.text;
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = o.base || 'alphabetic';
  ctx.letterSpacing = (o.ls || 0) + 'px';
  if (o.alpha != null) ctx.globalAlpha *= o.alpha;
  ctx.fillText(str, x, y);
  const w = ctx.measureText(str).width;
  ctx.restore();
  return w;
}
function TW(str, o = {}) {
  ctx.save(); ctx.font = font(o.size || 16, o.weight || 400, o.mono); ctx.letterSpacing = (o.ls || 0) + 'px';
  const w = ctx.measureText(str).width; ctx.restore(); return w;
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function panel(x, y, w, h, o = {}) {

}
function withA(a, fn) { if (a <= 0.001) return; ctx.save(); ctx.globalAlpha *= a; fn(); ctx.restore(); }
