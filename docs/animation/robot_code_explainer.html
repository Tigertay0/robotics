<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>How our robots think</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=block" rel="stylesheet">
<style>
:root{--bg:#04070d;--hud:rgba(11,17,29,.92);--fg:#e9eef5;--mute:#97a3b6;--acc:#3fd5e6}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
#cv{position:absolute;display:block}
#hud{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;
  padding:8px 14px;background:var(--hud);border:1px solid #27344b;border-radius:10px;color:var(--fg);
  font:13px/1 "JetBrains Mono",Consolas,monospace;opacity:0;transition:opacity .35s ease;width:min(720px,calc(100vw - 32px));box-sizing:border-box}
#hud.on{opacity:1}
#hud button{background:none;border:1px solid #33425c;color:var(--fg);border-radius:6px;width:34px;height:28px;cursor:pointer;font:inherit}
#hud input{flex:1;accent-color:var(--acc);min-width:0}
#hud span{color:var(--mute);white-space:nowrap}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud"><button id="pp" aria-label="Play or pause">&#9654;</button><input id="scrub" type="range" min="0" max="150" step="0.01" value="0" aria-label="Timeline"><span id="tc">0:00 / 2:30</span></div>
<script>
'use strict';
const SRC_A = "/******************************************************************************\n * Robot A - \"Duck Runner\"                                   2026 Fall Game\n * KIPR Wombat, 4 gear motors on mecanum wheels, 3 servo flaps, tophats.\n *\n * Implements the Robot A column of STRATEGY.md section 4.\n * Every number marked CALIBRATE was budgeted, not measured: tune it on the\n * real robot before trusting the timeline.\n *\n * Motor ports follow last season's wiring (Botball robotics 2025_26.pdf):\n *   FR 0, FL 1, BR 2, BL 3.  Encoder: 1870 ticks per wheel revolution.\n *****************************************************************************/\n#include <kipr/wombat.h>\n#include <stdio.h>\n#include <stdlib.h>    /* abs, labs */\n#include <math.h>\n\n/* ---------------------------------------------------------------- ports */\n#define FR 0\n#define FL 1\n#define BR 2\n#define BL 3\n#define SERVO_GATE_C   0      /* intake flap, front            (regular servo) */\n#define SERVO_GATE_B   1      /* pin flap, one duck from rear  (micro servo)   */\n#define SERVO_GATE_A   2      /* exit flap, rear               (regular servo) */\n#define TOPHAT_L       0      /* analog: left tape sensor at the lane mouth    */\n#define TOPHAT_R       1      /* analog: right tape sensor                     */\n#define ET_FRONT       2      /* analog: ET rangefinder looking forward        */\n#define LIGHT_START    3      /* analog: starting-light sensor                 */\n#define TOUCH_LANE     0      /* digital: pressed when the 5th duck is in      */\n\n/* ---------------------------------------------------------------- calibration */\n#define TICKS_PER_REV   1870.0\n#define WHEEL_DIAM_IN   2.36                 /* CALIBRATE: 60 mm mecanum; last year's wheels were 3.0 */\n#define TICKS_PER_INCH  (TICKS_PER_REV / (M_PI * WHEEL_DIAM_IN))\n#define STRAFE_FACTOR   1.15                 /* CALIBRATE: mecanum wheels slip sideways */\n#define TAPE_THRESHOLD  2700                 /* CALIBRATE: analog (12-bit) < this = black (last year 2700) */\n#define LIGHT_ON        770                  /* CALIBRATE: analog < this = light on (last year 770) */\n#define SPEED_FAST      80\n#define SPEED_LINE      45                   /* line-following speed while swallowing ducks */\n#define SPEED_SLOW      30\n#define MATCH_END_S     118                  /* hard stop; rules DQ a robot still moving at 120 */\n\n/* servo positions, CALIBRATE on the built flaps */\n#define GATE_OPEN    1900\n#define GATE_CLOSED  1000\n\n/* ---------------------------------------------------------------- mecanum base */\n/* vx: + forward (east at start), vy: + left (north at start), w: + counter-clockwise */\nstatic void mecanum(int vx, int vy, int w) {\n    /* Each wheel is a sum of up to three terms, so a mix can exceed motor()'s -100..100\n       range. Scale all four together rather than letting motor() clip them one by one:\n       clipping per wheel would silently bend the commanded direction. */\n    int m[4] = { vx - vy - w, vx + vy + w, vx + vy - w, vx - vy + w };   /* FL, FR, BL, BR */\n    int peak = 0;\n    for (int i = 0; i < 4; i++)\n        if (abs(m[i]) > peak) peak = abs(m[i]);\n    if (peak > 100)\n        for (int i = 0; i < 4; i++) m[i] = m[i] * 100 / peak;\n    motor(FL, m[0]);\n    motor(FR, m[1]);\n    motor(BL, m[2]);\n    motor(BR, m[3]);\n}\nstatic void stop_all(void) { ao(); }\n\n/* Drive a straight distance in inches; dx forward, dy left. Pass exactly one non-zero:\n   direction is quantised to the sign of dx/dy and the tick target is |dx|+|dy|, so a\n   diagonal call drives 45 deg for a Manhattan distance and misses the waypoint. Split\n   diagonals into two calls at the call site. */\nstatic void move_in(double dx, double dy, int speed) {\n    double dist = fabs(dx) + fabs(dy);\n    double factor = (dy != 0) ? STRAFE_FACTOR : 1.0;\n    long target = (long)(dist * TICKS_PER_INCH * factor);\n    int vx = (dx > 0) - (dx < 0), vy = (dy > 0) - (dy < 0);\n    cmpc(FL);\n    mecanum(vx * speed, vy * speed, 0);\n    while (labs(gmpc(FL)) < target && seconds() < MATCH_END_S) msleep(5);\n    stop_all();\n    if (labs(gmpc(FL)) < target)   /* ran out of match clock: say so, or the rest of the run\n                                      silently no-ops and the log shows nothing wrong */\n        printf(\"move_in(%.1f, %.1f) stopped at %ld/%ld ticks, t=%.1f s\\n\",\n               dx, dy, labs(gmpc(FL)), target, seconds());\n    msleep(150);\n}\n\n/* keep the lane mouth on the centre tape while creeping east, until the lane is full */\nstatic void follow_tape_east(double inches, int speed) {\n    long target = (long)(inches * TICKS_PER_INCH);\n    cmpc(FL);\n    /* the touch switch at the rear of the lane is the real stop condition; the distance\n       is only the backstop for a switch that never trips */\n    while (labs(gmpc(FL)) < target && !digital(TOUCH_LANE) && seconds() < MATCH_END_S) {\n        int l = analog(TOPHAT_L) < TAPE_THRESHOLD;\n        int r = analog(TOPHAT_R) < TAPE_THRESHOLD;\n        if (l && !r)      mecanum(speed, +20, 0);   /* drifted right: nudge left  */\n        else if (r && !l) mecanum(speed, -20, 0);   /* drifted left: nudge right  */\n        else              mecanum(speed, 0, 0);\n        msleep(10);\n    }\n    stop_all();\n    printf(\"follow_tape_east: %ld/%ld ticks, lane full=%d, t=%.1f s\\n\",\n           labs(gmpc(FL)), target, digital(TOUCH_LANE), seconds());\n}\n\n/* ---------------------------------------------------------------- escapement */\nstatic void gates_init(void) {\n    set_servo_position(SERVO_GATE_C, GATE_OPEN);     /* intake open while collecting */\n    set_servo_position(SERVO_GATE_B, GATE_OPEN);\n    set_servo_position(SERVO_GATE_A, GATE_CLOSED);   /* exit shut */\n}\n\n/* release exactly one duck: pin holds duck #2, exit opens, robot creeps forward, exit shuts */\nstatic void drop_one_duck(void) {\n    set_servo_position(SERVO_GATE_B, GATE_CLOSED);   /* pin the second duck from the rear */\n    msleep(300);\n    set_servo_position(SERVO_GATE_A, GATE_OPEN);\n    msleep(300);\n    move_in(2.5, 0, SPEED_SLOW);                     /* lane slides over the rear duck, it stays */\n    set_servo_position(SERVO_GATE_A, GATE_CLOSED);\n    msleep(250);\n    set_servo_position(SERVO_GATE_B, GATE_OPEN);     /* remaining ducks settle to the rear */\n    msleep(400);\n}\n\n/* ---------------------------------------------------------------- main */\nint main(void) {\n    enable_servos();\n    gates_init();\n    printf(\"Robot A ready. Waiting for the light.\\n\");\n    while (analog(LIGHT_START) > LIGHT_ON) msleep(10);   /* wait_for_light(LIGHT_START) also works */\n    shut_down_in(119.0);                                  /* safety: everything off before 120 s */\n\n    /* 0-16 s: wait for Robot B to clear the upper cup (IR handshake could replace this) */\n    msleep(16000);\n\n    /* 16-24 s: north out of the small box, then onto the centre tape at x = 44 */\n    move_in(0, 13.9, SPEED_FAST);            /* (54.3, 5.6) -> (54.3, 19.5) */\n    /* two axis-aligned legs, not one diagonal: move_in() quantises direction to the sign of\n       dx/dy, so a diagonal drives at a fixed 45 deg for a Manhattan tick target and lands\n       somewhere else entirely. West first keeps us south of the tape, clear of the ducks. */\n    move_in(-10.3, 0, SPEED_FAST);           /* -> (44, 19.5) */\n    move_in(0, 6.1, SPEED_FAST);             /* -> (44, 25.6), at the lane mouth */\n\n    /* 24-41 s: swallow the five ducks, line-following east */\n    follow_tape_east(36.0, SPEED_LINE);      /* until the touch switch, or 36 in */\n    set_servo_position(SERVO_GATE_C, GATE_CLOSED);\n\n    /* zone 2 (TR): strafe north-east, drop, creep forward */\n    move_in(0, 8.9, SPEED_FAST);  move_in(-0.5, 0, SPEED_SLOW);   /* -> (79.5, 34.5) */\n    drop_one_duck();                                               /* duck at ~(72, 34.5) */\n\n    /* zone 4 (MR) */\n    move_in(0, -11.0, SPEED_FAST);                                 /* -> (81, 23.5) */\n    drop_one_duck();                                               /* duck at ~(73.6, 23.5) */\n\n    /* west along y = 17, hold until B has finished the cups (timed; IR message is better) */\n    move_in(0, -6.5, SPEED_FAST);\n    move_in(-25.6, 0, SPEED_FAST);                                 /* -> (56, 17) */\n    while (seconds() < 74) msleep(50);\n\n    /* zone 3 (ML) */\n    move_in(0, 2.5, SPEED_FAST);                                   /* -> (56, 19.5) */\n    move_in(-22.2, 0, SPEED_FAST);                                 /* -> (33.8, 19.5) */\n    drop_one_duck();                                               /* duck at ~(26.5, 19.5) */\n\n    /* up the centre column to y = 34.6, west, zone 1 (TL) */\n    move_in(10.2, 0, SPEED_FAST);                                  /* -> (48, 19.5) */\n    move_in(0, 15.1, SPEED_FAST);                                  /* -> (48, 34.6) */\n    move_in(-14.2, 0, SPEED_FAST);                                 /* -> (33.8, 34.6) */\n    drop_one_duck();                                               /* duck at ~(26.5, 34.6) */\n\n    /* back down the centre column, west along the bottom, zone 5 (BL) */\n    move_in(12.0, 0, SPEED_FAST);                                  /* -> (48, 34.6) */\n    move_in(0, -29.0, SPEED_FAST);                                 /* -> (48, 5.6) */\n    move_in(-14.0, 0, SPEED_FAST);                                 /* -> (34, 5.6) */\n    drop_one_duck();                                               /* duck at ~(26.7, 5.6) */\n\n    stop_all();\n    disable_servos();\n    printf(\"Robot A done at %.1f s\\n\", seconds());\n    return 0;\n}\n";
const SRC_B = "/******************************************************************************\n * Robot B - \"Point Scorer\"                                  2026 Fall Game\n * KIPR Wombat, 2 gear motors (differential), servo arm + micro-servo claw,\n * cup-hook servo, camera, 2 tophats, ET, lever switch on the plow.\n *\n * Implements the Robot B column of STRATEGY.md section 4:\n *   upper cup -> wait -> lower cup + red pom -> 5 pom stacks -> pickleball 1\n *   -> red pom on the platform.\n * Numbers marked CALIBRATE were budgeted, not measured.\n *\n * Servo values are last season's measured ones (Botball robotics 2025_26.pdf)\n * for the same arm/claw servos; re-check after rebuilding.\n *****************************************************************************/\n#include <kipr/wombat.h>\n#include <stdio.h>\n#include <stdlib.h>    /* labs */\n#include <math.h>\n\n/* ---------------------------------------------------------------- ports */\n#define LEFT   0\n#define RIGHT  2\n#define SERVO_ARM    1            /* shoulder (regular servo)      */\n#define SERVO_CLAW   2            /* claw (micro servo)            */\n#define SERVO_HOOK   3            /* cup hook on the right side    */\n#define TOPHAT_L     0\n#define TOPHAT_R     1\n#define ET_FRONT     2\n#define LIGHT_START  3\n#define LEVER_PLOW   0            /* digital: plow touched something */\n#define CAM_RED      0            /* camera channel 0 = find_red.conf, as last year */\n\n/* ---------------------------------------------------------------- calibration */\n#define TICKS_PER_REV   1870.0\n#define WHEEL_DIAM_IN   2.75               /* CALIBRATE: Solarbotics wheel; last year's were 3.0 */\n#define TICKS_PER_INCH  (TICKS_PER_REV / (M_PI * WHEEL_DIAM_IN))\n#define TICKS_PER_DEG   13.0               /* CALIBRATE: last year's pivot constant (angle * 13) */\n#define TAPE_THRESHOLD  2700               /* CALIBRATE: analog (12-bit) < this = black */\n#define LIGHT_ON        770\n#define SPEED_FAST      80\n#define SPEED_PUSH      45\n#define MATCH_END_S     118\n\n#define ARM_UP        860                  /* measured last season */\n#define ARM_DOWN     1750\n#define ARM_PLATFORM  600                  /* CALIBRATE: claw above the 5.7 in platform edge */\n#define CLAW_OPEN    2000\n#define CLAW_CLOSED  1200\n#define HOOK_UP      1000                  /* CALIBRATE */\n#define HOOK_DOWN    1900\n\n/* ---------------------------------------------------------------- base */\nstatic void drive(int l, int r) { motor(LEFT, l); motor(RIGHT, r); }\nstatic void stop_all(void) { ao(); }\n\nstatic void forward_in(double inches, int speed) {\n    long target = (long)(fabs(inches) * TICKS_PER_INCH);\n    int s = inches < 0 ? -speed : speed;\n    cmpc(LEFT);\n    drive(s, s);\n    while (labs(gmpc(LEFT)) < target && seconds() < MATCH_END_S) msleep(5);\n    stop_all();\n    if (labs(gmpc(LEFT)) < target)   /* ran out of match clock: say so, or every later move\n                                        silently no-ops and the log shows nothing wrong */\n        printf(\"forward_in(%.1f) stopped at %ld/%ld ticks, t=%.1f s\\n\",\n               inches, labs(gmpc(LEFT)), target, seconds());\n    msleep(150);\n}\n/* positive = counter-clockwise (turn left), in place */\nstatic void turn_deg(double deg, int speed) {\n    long target = (long)(fabs(deg) * TICKS_PER_DEG);\n    cmpc(LEFT);\n    if (deg > 0) drive(-speed, speed); else drive(speed, -speed);\n    while (labs(gmpc(LEFT)) < target && seconds() < MATCH_END_S) msleep(5);\n    stop_all();\n    if (labs(gmpc(LEFT)) < target)\n        printf(\"turn_deg(%.1f) stopped at %ld/%ld ticks, t=%.1f s\\n\",\n               deg, labs(gmpc(LEFT)), target, seconds());\n    msleep(200);\n}\n/* gentle arc: inner wheel at half speed. sign of deg = direction as in turn_deg */\nstatic void arc_in(double inches, double deg, int speed) {\n    long target = (long)(fabs(inches) * TICKS_PER_INCH);\n    cmpc(LEFT); cmpc(RIGHT);\n    if (deg > 0) drive(speed / 2, speed); else drive(speed, speed / 2);\n    while ((labs(gmpc(LEFT)) + labs(gmpc(RIGHT))) / 2 < target && seconds() < MATCH_END_S) msleep(5);\n    stop_all();\n    if ((labs(gmpc(LEFT)) + labs(gmpc(RIGHT))) / 2 < target)\n        printf(\"arc_in(%.1f, %.1f) stopped short, t=%.1f s\\n\", inches, deg, seconds());\n    msleep(150);                 /* settle, as forward_in and turn_deg do */\n}\n/* drive forward until a tophat sees tape, then stop. max_in bounds the blind drive so a\n   missed line does not push the robot into a wall for the rest of the match. */\nstatic void forward_to_tape(int speed, double max_in) {\n    long target = (long)(fabs(max_in) * TICKS_PER_INCH);\n    cmpc(LEFT);\n    drive(speed, speed);\n    while (analog(TOPHAT_L) >= TAPE_THRESHOLD && analog(TOPHAT_R) >= TAPE_THRESHOLD\n           && labs(gmpc(LEFT)) < target && seconds() < MATCH_END_S) msleep(5);\n    stop_all();\n    if (analog(TOPHAT_L) >= TAPE_THRESHOLD && analog(TOPHAT_R) >= TAPE_THRESHOLD)\n        printf(\"forward_to_tape: no tape within %.1f in, t=%.1f s\\n\", max_in, seconds());\n    msleep(150);\n}\n\n/* ---------------------------------------------------------------- tools */\nstatic void flip_cup_with_right_wing(double push_in) {\n    /* the cup is upside-down; the hook catches the rim, the wing rolls it upright\n       while the robot keeps pushing. CALIBRATE the hook height on the real cup. */\n    set_servo_position(SERVO_HOOK, HOOK_DOWN);\n    msleep(300);\n    forward_in(push_in, SPEED_PUSH);\n    set_servo_position(SERVO_HOOK, HOOK_UP);\n}\n\n/* Find the red pom with the camera, centre on it, grab it. Returns 1 on success.\n   Everything after this call is dead reckoning from the pre-scan pose, so the scan\n   rotation and the approach are both undone before returning, on success and failure\n   alike. Without that, a pom that is a few degrees off frame leaves the robot facing\n   an arbitrary direction for the whole rest of the match. */\nstatic int grab_red_pom(void) {\n    set_servo_position(SERVO_CLAW, CLAW_OPEN);\n    set_servo_position(SERVO_ARM, ARM_DOWN);\n    msleep(400);\n    camera_open();\n    const int CAM_TRIES = 40;                                /* x 100 ms = ~4 s budget */\n    int found = 0;\n    cmpc(LEFT);                                              /* net scan rotation, in ticks */\n    for (int tries = 0; tries < CAM_TRIES && !found; tries++) {\n        camera_update();\n        if (get_object_count(CAM_RED) > 0) {\n            int x = get_object_center_x(CAM_RED, 0);        /* 0..159 */\n            if (x < 70)       drive(-25, 25);\n            else if (x > 90)  drive(25, -25);\n            else { found = 1; stop_all(); }\n        } else {\n            drive(-25, 25);                                  /* scan */\n        }\n        msleep(100);\n    }\n    camera_close();\n    stop_all();\n    long spun = gmpc(LEFT);                                  /* signed: which way we turned */\n    if (found) {\n        forward_in(2.0, 30);\n        set_servo_position(SERVO_CLAW, CLAW_CLOSED);\n        msleep(400);\n        set_servo_position(SERVO_ARM, ARM_UP);\n        msleep(400);\n        forward_in(-2.0, 30);                                /* undo the approach */\n    } else {\n        printf(\"red pom not seen in %d camera frames\\n\", CAM_TRIES);\n        set_servo_position(SERVO_ARM, ARM_UP);\n    }\n    /* unwind the scan rotation back to the heading the caller assumes */\n    if (labs(spun) > 20) {\n        cmpc(LEFT);\n        if (spun > 0) drive(-25, 25); else drive(25, -25);   /* spun>0 = turned right: turn back left */\n        while (labs(gmpc(LEFT)) < labs(spun) && seconds() < MATCH_END_S) msleep(5);\n        stop_all();\n        msleep(200);\n    }\n    return found;\n}\n\n/* push one pom stack north off the tape: start 3.5 in south of the stack line */\nstatic void push_stack_north(void) {\n    forward_in(3.5, SPEED_PUSH);       /* stack ends ~2 in north of the tape edge */\n    forward_in(-3.5, SPEED_FAST);\n}\n\n/* ---------------------------------------------------------------- main */\nint main(void) {\n    enable_servos();\n    set_servo_position(SERVO_ARM, ARM_UP);\n    set_servo_position(SERVO_CLAW, CLAW_OPEN);\n    set_servo_position(SERVO_HOOK, HOOK_UP);\n    printf(\"Robot B ready. Waiting for the light.\\n\");\n    while (analog(LIGHT_START) > LIGHT_ON) msleep(10);\n    shut_down_in(119.0);\n\n    /* 0-16 s: out of zone 5 heading NE, left plow wing takes the upper cup north-east into zone 2 */\n    arc_in(5.0, +45, SPEED_FAST);               /* (33, 5.6) -> facing NE */\n    forward_in(17.5, SPEED_FAST);               /* -> ~(48.5, 21): wing meets the cup */\n    forward_in(12.0, SPEED_PUSH);               /* cup rolls upright and slides to ~(59.5, 34) */\n    arc_in(9.0, -45, SPEED_FAST);               /* -> ~(64, 32) facing east */\n\n    /* 17-32 s: loop down the east side; face west by the lower cup at (68, 16) */\n    arc_in(12.0, -60, SPEED_FAST);\n    forward_in(10.0, SPEED_FAST);\n    arc_in(8.0, -75, SPEED_FAST);               /* now heading west at ~(68, 16) */\n\n    /* 32-50 s: wait for A to finish the duck run and the first two drops */\n    while (seconds() < 50) msleep(50);\n\n    /* 50-58 s: flip the lower cup with the right wing + hook, push it west into zone 5 */\n    forward_in(11.4, SPEED_FAST);               /* -> (56.6, 16): wing meets the cup rim */\n    flip_cup_with_right_wing(28.0);             /* cup ends ~(18.5, 7.3); hidden poms spill */\n\n    /* 58-63 s: the red pom */\n    forward_in(-1.0, SPEED_FAST);\n    int have_red = grab_red_pom();\n    if (!have_red) printf(\"red pom not found, skipping the platform\\n\");\n\n    /* 63-86 s: five pom stacks, east to west, each pushed north into zone 1 */\n    forward_in(-10.0, SPEED_FAST);              /* back east to x ~ 39.8 */\n    turn_deg(-90, SPEED_FAST);                  /* facing west -> clockwise 90 = face north */\n    forward_to_tape(SPEED_FAST, 10.0);          /* lower tape: y ~ 12; give up after 10 in */\n    forward_in(3.5, SPEED_FAST);                /* -> y ~ 15.5 */\n    for (int k = 0; k < 5; k++) {\n        push_stack_north();\n        if (k < 4) {                            /* side-step 8 in west: back-arc then forward-arc */\n            arc_in(-6.0, -40, SPEED_FAST);\n            arc_in(6.0, +40, SPEED_FAST);\n        }\n    }\n\n    /* 86-97 s: down to the bottom wall and east to pickleball 1 */\n    forward_in(-5.0, SPEED_FAST);\n    turn_deg(-90, SPEED_FAST);                  /* face east at ~(6.5, 14) */\n    forward_in(27.5, SPEED_FAST);               /* -> (34, 14) */\n    arc_in(10.0, -35, SPEED_FAST);              /* -> ~(42, 8) */\n    arc_in(4.5, +35, SPEED_FAST);               /* -> (45, 5.3) facing east */\n    set_servo_position(SERVO_HOOK, HOOK_DOWN);  /* hook sweeps the ball off its post */\n    forward_in(2.5, SPEED_PUSH);\n    set_servo_position(SERVO_HOOK, HOOK_UP);\n\n    /* 97-104 s: push the ball under the platform, stop at x = 66 */\n    forward_in(18.5, SPEED_PUSH);\n\n    /* 104-112 s: red pom alone on the platform (big duck is allowed next to it) */\n    if (have_red) {\n        set_servo_position(SERVO_ARM, ARM_PLATFORM);\n        msleep(1200);\n        set_servo_position(SERVO_CLAW, CLAW_OPEN);\n        msleep(400);\n        set_servo_position(SERVO_ARM, ARM_UP);\n    }\n\n    stop_all();\n    disable_servos();\n    printf(\"Robot B done at %.1f s\\n\", seconds());\n    return 0;\n}\n";

/* =========================================================== render loop */
const SCENES = [[S1, scene1], [S2, scene2], [S3, scene3], [S4, scene4], [S5, scene5]];
const XF = .4;
let VIEWK = 1;
function draw() {
  const t = CUR;
  ctx.setTransform(VIEWK, 0, 0, VIEWK, 0, 0);
  ctx.globalAlpha = 1; bg();
  SCENES.forEach(([[a, b], fn], i) => {
    const last = i === SCENES.length - 1;
    if (t < a || t >= b + (last ? 1 : XF)) return;
    const al = (i === 0 ? 1 : sstep(a, a + .5, t)) * (last ? 1 : 1 - sstep(b, b + XF, t));
    if (al <= 0) return;
    ctx.save(); ctx.globalAlpha = al; fn(t); ctx.restore();
  });

}
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H), dpr = window.devicePixelRatio || 1;
  const cw = Math.round(W * s), chh = Math.round(H * s);
  cv.style.width = cw + 'px'; cv.style.height = chh + 'px';
  cv.style.left = Math.round((innerWidth - cw) / 2) + 'px'; cv.style.top = Math.round((innerHeight - chh) / 2) + 'px';
  cv.width = Math.round(cw * dpr); cv.height = Math.round(chh * dpr); VIEWK = cv.width / W;
  if (window.__ready) draw();
}

/* audio: subtle ticks on score events (optional) */
const AU = {ctx: null, g: null};
function audioInit() { try { AU.ctx = AU.ctx || new (window.AudioContext || window.webkitAudioContext)(); AU.g = AU.ctx.createGain(); AU.g.gain.value = .18; AU.g.connect(AU.ctx.destination); } catch (e) { AU.ctx = null; } }
function blip(t0, f, d, v) { const c = AU.ctx; if (!c) return; const o = c.createOscillator(), g = c.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(f, t0); g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(v, t0 + .005); g.gain.exponentialRampToValueAtTime(.0001, t0 + d); o.connect(g); g.connect(AU.g); o.start(t0); o.stop(t0 + d + .02); }
const SFX = {tick: (t0) => blip(t0, 1400, .06, .5), score: (t0) => { blip(t0, 880, .18, .45); blip(t0 + .07, 1320, .22, .35); }, duck: (t0) => { blip(t0, 660, .2, .45); blip(t0 + .08, 990, .25, .4); }};
const AEV = [];
SCENES.forEach(([[a]], i) => { if (i) AEV.push({t: a, name: 'tick'}); });
EVENTS.forEach(e => AEV.push({t: sceneOfMatch(e.t), name: e.duck ? 'duck' : 'score'}));
AEV.sort((a, b) => a.t - b.t);

/* playback */
let CUR = 0, playing = false, lastTs = null, hudTimer = null;
const hud = document.getElementById('hud'), pp = document.getElementById('pp'), scrub = document.getElementById('scrub'), tc = document.getElementById('tc');
scrub.max = DUR;
const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
function updHud() { scrub.value = CUR; tc.textContent = fmt(CUR) + ' / ' + fmt(DUR); pp.innerHTML = playing ? '&#10074;&#10074;' : '&#9654;'; }
function play() { if (CUR >= DUR - .01) CUR = 0; playing = true; lastTs = null; updHud(); }
function pause() { playing = false; updHud(); }
function toggle() { if (!AU.ctx) audioInit(); if (AU.ctx && AU.ctx.state === 'suspended') AU.ctx.resume(); playing ? pause() : play(); }
function loop(ts) {
  if (playing) {
    if (lastTs != null) {
      const prev = CUR; CUR = Math.min(DUR, CUR + (ts - lastTs) / 1000);

addEventListener('mousemove', showHud);
addEventListener('keydown', e => {

  else if (e.code === 'ArrowRight') { CUR = Math.min(DUR, CUR + 5); draw(); updHud(); showHud(); }
  else if (e.code === 'ArrowLeft') { CUR = Math.max(0, CUR - 5); draw(); updHud(); showHud(); }

cv.addEventListener('click', () => { toggle(); showHud(); });
pp.addEventListener('click', () => toggle());
scrub.addEventListener('input', () => { CUR = +scrub.value; draw(); updHud(); });

window.__seek = t => { playing = false; CUR = clamp(+t || 0, 0, DUR); draw(); updHud(); };
window.__video = {seek: t => window.__seek(t), duration: DUR, fps: 30, width: W, height: H, AU, AEV, SFX, audioInit};

(async function boot() {

    await Promise.race([
